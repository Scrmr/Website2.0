name: Validate and deploy Node.js 24

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_ID: node24-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Record current traffic for rollback
        run: gcloud app services describe default --format='json(split)' > "$RUNNER_TEMP/traffic-before.json"
      - name: Deploy candidate without shifting traffic
        id: candidate
        uses: google-github-actions/deploy-appengine@v3
        with:
          deliverables: app.yaml
          version: ${{ env.VERSION_ID }}
          promote: false
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
      - name: Confirm cloud runtime
        run: |
          runtime=$(gcloud app versions describe "$VERSION_ID" --service default --format='value(runtime)')
          test "$runtime" = nodejs24
          echo "Confirmed runtime: $runtime"
      - name: Check candidate health, live AI and multiplayer
        env:
          BASE_URL: ${{ steps.candidate.outputs.version_url }}
          EXPECTED_VERSION: ${{ env.VERSION_ID }}
          RUN_AI: '1'
        run: node scripts/smoke-live.js
      - name: Check traffic has not changed concurrently
        run: |
          gcloud app services describe default --format='json(split)' > "$RUNNER_TEMP/traffic-now.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const read = name => JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/${name}`)).split;
          assert.deepEqual(read('traffic-now.json'), read('traffic-before.json'));
          JS
      - name: Promote checked version
        id: promote
        run: gcloud app services set-traffic default --splits "$VERSION_ID=1" --quiet
      - name: Check production after promotion
        env:
          BASE_URL: https://poemgenerator-492211.appspot.com
          EXPECTED_VERSION: ${{ env.VERSION_ID }}
          RUN_AI: '0'
        run: node scripts/smoke-live.js
      - name: Restore previous traffic if promotion or production checks fail
        if: failure() && steps.promote.outcome != 'skipped'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { split } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/traffic-before.json`));
          const allocations = Object.entries(split.allocations).map(([version, weight]) => `${version}=${weight}`).join(',');
          if (!allocations) throw new Error('No original traffic allocation recorded');
          execFileSync('gcloud', ['app', 'services', 'set-traffic', 'default', '--splits', allocations,
            '--split-by', (split.shardBy || 'IP').toLowerCase(), '--quiet'], { stdio: 'inherit' });
          JS
      - name: Report resulting traffic
        if: always()
        run: gcloud app services describe default --format='json(split)'
